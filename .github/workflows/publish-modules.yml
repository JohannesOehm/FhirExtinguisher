name: Publish Standalone Modules

on:
  push:
    branches:
      - master
      - extinguisher-module #Remove before merging with master
  workflow_dispatch:

jobs:
  publish:
    name: Publish Standalone Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Publish all modules
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -PusePublishedDependencies=true publishAllModules